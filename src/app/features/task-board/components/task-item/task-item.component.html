<div class="group flex items-start gap-4 p-4 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-all duration-200"
    [class.opacity-75]="task().completed">
    <!-- Toggle Checkbox -->
    <button (click)="toggle.emit(task().id)"
        class="mt-1 shrink-0 w-6 h-6 rounded-full border-2 transition-colors duration-200 flex items-center justify-center"
        [class.bg-indigo-600]="task().completed" [class.border-indigo-600]="task().completed"
        [class.border-slate-300]="!task().completed">
        @if (task().completed) {
        <mat-icon class="text-white text-sm! h-4! w-4! flex items-center justify-center">check</mat-icon>
        }
    </button>

    <!-- Content -->
    <div class="flex-1 min-w-0 cursor-pointer" (click)="openEditDialog()">
        <h3 class="text-base font-semibold text-slate-900 transition-all duration-200 truncate">
            {{ task().title }}
        </h3>
        @if (task().description) {
        <p class="text-sm text-slate-600 mt-1 truncate" [title]="task().description">
            {{ task().description }}
        </p>
        }
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-1">
        <button mat-icon-button [matMenuTriggerFor]="menu"
            class="text-slate-400 hover:text-slate-600 transition-colors">
            <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu" xPosition="before"
            class="rounded-xl overflow-hidden border border-slate-100 shadow-xl">
            <button mat-menu-item (click)="openEditDialog()" class="group py-3">
                <mat-icon class="text-indigo-600 group-hover:scale-110 transition-transform">edit</mat-icon>
                <span class="text-sm font-medium text-slate-700">Edit</span>
            </button>
            <button mat-menu-item (click)="openDeleteConfirm()" class="group py-3">
                <mat-icon class="text-red-600! group-hover:scale-110 transition-transform">delete_outline</mat-icon>
                <span class="text-sm font-medium text-slate-700">Delete</span>
            </button>
        </mat-menu>
    </div>
</div>
