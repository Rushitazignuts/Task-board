<div class="flex flex-col h-full">
    @if (title()) {
    <h2 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4 px-1">
        {{ title() }} ({{ tasks().length }})
    </h2>
    }

    <div cdkDropList [id]="listId()" [cdkDropListData]="tasks()" [cdkDropListConnectedTo]="connectedTo()"
        (cdkDropListDropped)="onDrop($event)" class="flex-1 flex flex-col gap-3 min-h-[150px]">
        @for (task of tasks(); track task.id) {
        <div cdkDrag [cdkDragData]="task"
            class="cdk-drag-placeholder:bg-slate-100 cdk-drag-placeholder:border-2 cdk-drag-placeholder:border-dashed cdk-drag-placeholder:border-slate-300 cdk-drag-placeholder:rounded-xl">
            <app-task-item [task]="task" (toggle)="taskService.toggleTask($event)"
                (delete)="taskService.deleteTask($event)" (update)="updateTask($event)"></app-task-item>

            <!-- Drag Preview -->
            <div *cdkDragPreview class="shadow-2xl opacity-90 scale-105">
                <app-task-item [task]="task"></app-task-item>
            </div>
        </div>
        }

        @if (tasks().length === 0) {
        <div
            class="flex items-center justify-center p-8 border-2 border-dashed border-slate-200 rounded-xl text-slate-400 text-sm italic">
            No tasks here
        </div>
        }
    </div>
</div>
