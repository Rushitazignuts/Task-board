<div class="p-2 max-w-[360px]">
    <div class="flex items-center gap-3 mb-4">
        <div class="p-2 bg-red-50 rounded-lg text-red-600">
            <mat-icon>delete_forever</mat-icon>
        </div>
        <h2 class="text-xl font-bold text-slate-900 m-0">{{ data.title }}</h2>
    </div>

    <mat-dialog-content class="m-0! p-0!">`
        <p>{{ data.message }}</p>
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="px-0! pb-0! mt-8 gap-3">
        <button mat-button class="rounded-xl! font-semibold! px-4!" (click)="onNo()">
            Keep Task
        </button>
        <button mat-flat-button color="warn" class="rounded-xl!" (click)="onYes()">
            Delete Task
        </button>
    </mat-dialog-actions>
</div>
