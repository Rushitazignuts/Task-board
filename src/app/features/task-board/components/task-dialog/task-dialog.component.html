<div class="p-2 min-w-[340px]">
    <div class="flex items-center gap-3 mb-6">

        <h2 class="text-xl font-bold text-slate-900 m-0">
            {{ data.task ? 'Edit Task' : 'New Task' }}
        </h2>
    </div>

    <mat-dialog-content class="m-0! p-0!">
        <div class="space-y-4">
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-500 tracking-wider ml-1">Task Title</label>
                <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
                    <input matInput [(ngModel)]="taskData.title" placeholder="Enter task title" required
                        #titleInput="ngModel" cdkFocusInitial />
                    @if (titleInput.invalid && (titleInput.dirty || titleInput.touched)) {
                    <mat-error>Title is required</mat-error>
                    }
                </mat-form-field>
            </div>

            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-500 tracking-wider ml-1">Description
                </label>
                <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
                    <textarea matInput [(ngModel)]="taskData.description" rows="4"
                        placeholder="Add more details..."></textarea>
                </mat-form-field>
            </div>
        </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="px-0! pb-0! mt-8 gap-3">
        <button mat-button class="rounded-xl! font-semibold! px-4!" (click)="onCancel()">
            Cancel
        </button>
        <button mat-flat-button color="primary" class="rounded-xl!" (click)="onSave()">
            {{ data.task ? 'Save Changes' : 'Create Task' }}
        </button>
    </mat-dialog-actions>
</div>
